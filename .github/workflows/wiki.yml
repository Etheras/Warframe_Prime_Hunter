name: Publish the wiki

# The GitHub wiki is generated from the documentation already in this repository
# and pushed here — never edited on github.com. A wiki is a second place a fact
# can live, and this project has repeatedly been bitten by a fact that was true
# in one place and stale in another; a hand-written wiki would be the worst
# version of that, because nothing in the suite would ever look at it.
#
# tools/wiki.py assembles the pages out of named sections of README.md,
# PROJECT.md and TODO.md, and fails loudly if a heading it wants has been
# reworded. The test suite runs that check, so a rename breaks the build in
# front of whoever renamed it rather than thinning a page nobody is watching.
#
# Deliberately NOT on the ten-minute schedule that publish.yml uses. Nothing on
# these pages moves that fast, and a wiki with 144 commits a day is a wiki
# nobody can read the history of.

on:
  push:
    branches: [main]
    # Only when something a page is built from could have changed. Everything
    # else is caught by the daily run, and the job checks the content really
    # differs before committing anyway — this filter only saves runner minutes.
    paths:
      - "README.md"
      - "PROJECT.md"
      - "TODO.md"
      - "STYLE.md"
      - "NOTICE.md"
      - "tools/wiki.py"
      - ".github/workflows/wiki.yml"
  schedule:
    # Daily, an hour after the full site build, so the dataset figures on the
    # landing page are the ones that build produced.
    - cron: "40 19 * * *"
  workflow_dispatch:

# Read-only floor, exactly like publish.yml. `contents: write` is what GitHub
# requires to push to the .wiki.git repository behind the wiki tab, and it is
# not scoped any narrower than that — so it is granted to the one job that
# pushes, and to nothing else.
#
# Declared here, at workflow level, this was the floor for the whole run until
# 2026-09-01: the job that fetches from half a dozen third-party endpoints and
# builds a dataset out of what they return held a token that could write this
# repository, for every second of it. It never used that token — the push
# clones the wiki with its own credential in the URL — so the grant bought
# nothing and was carried through the one step where somebody else's bytes are
# parsed. Splitting the two apart is the pattern publish.yml already uses,
# where the build job is `contents: read` and Pages/OIDC are granted only to
# the deploy job.
#
# The default GITHUB_TOKEN is enough for a wiki in the same repository, so this
# needs no secret and no personal access token, which keeps the project's "no
# secrets anywhere" property true.
permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  # Everything that reaches the network or runs a build, holding nothing above
  # the read-only floor. What it produces is handed to the next job as an
  # artifact rather than pushed from here.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operation happens in this job at all, so it has no use for
          # the credential checkout would otherwise leave in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Read-only: the daily site build owns this cache. It is here so the
      # landing page can state real dataset figures — how many Primes, how many
      # relics are dropping — rather than saying it had no data.
      - name: Restore source cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prime-sources-
          path: .cache
          restore-keys: |
            prime-sources-
            vorframe-sources-

      # Cheap on a warm cache and correct on a cold one: with nothing to restore
      # this does a full build, and the page gets real numbers either way. The
      # `|| true` covers the case where a cold build cannot reach a source at
      # all — the wiki is still worth publishing without a figures table, and
      # tools/wiki.py says so in place of inventing one.
      - name: Get the dataset, for the figures on the landing page
        run: python tools/build_data.py --if-changed --no-images || true

      - name: Build the pages
        run: python tools/wiki.py

      # The handover, and `if-no-files-found: error` is the part of it that
      # matters. The push below replaces the wiki wholesale, so a wiki.py that
      # produced nothing would arrive as an empty directory and delete every
      # page rather than fail. Failing here is the cheaper end of that.
      - name: Hand the pages to the job that can push them
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-pages
          path: dist/wiki
          if-no-files-found: error
          retention-days: 1

  # The only job that can write, and the only one that needs to. It never checks
  # this repository out, never installs Python and never speaks to an upstream:
  # it takes the generated pages from the artifact and pushes them, which is the
  # single moment `contents: write` exists at all.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Take the pages from the generate job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wiki-pages
          path: dist/wiki

      - name: Publish
        env:
          # Masked by Actions. Kept out of the command line for the same reason.
          GH_TOKEN: ${{ github.token }}
          # `${{ }}` is substituted into the script *before* a shell sees it, so
          # an expression written inline is not a variable — it is text pasted
          # into the command. This one is `github.repository`, which GitHub sets
          # and nobody can influence, so it was a shape rather than a hole; it
          # went through `env` on 2026-09-04 anyway, because the shape is the
          # part that gets copied. The next expression somebody pastes in beside
          # it may be a branch or an issue title, and those are attacker-supplied.
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" \
            wiki-repo

          # The wiki is wholly generated, so it is replaced rather than merged:
          # a page that is no longer in the manifest should stop existing, and
          # every page says in its own banner that edits here are overwritten.
          rm -f wiki-repo/*.md
          cp dist/wiki/*.md wiki-repo/

          cd wiki-repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "wiki: already matches the repository, nothing to push"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate from ${GITHUB_SHA:0:7}

          Built by tools/wiki.py from README.md, PROJECT.md and TODO.md.
          Edit those, not this wiki — the next run overwrites it."
          git push
          echo "wiki: pushed $(git rev-parse --short HEAD)"
