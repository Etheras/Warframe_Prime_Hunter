name: Build and publish site

# Builds the dataset fresh from Digital Extremes' public sources and publishes
# the result to GitHub Pages.
#
# The data is NEVER committed to this repository — it is downloaded at build
# time and handed straight to Pages as an artifact. The repo stays source-only,
# and the published site always reflects DE's current drop tables.
#
# No secrets, no API keys, no pip install: every source is public and the
# pipeline is Python standard library only.

on:
  push:
    branches: [main]
  schedule:
    # 18:05 UTC daily — the FULL build, five minutes after the only fixed
    # boundary in this dataset. Prime Resurgence rotations flip at 18:00 UTC
    # exactly: `PrimeVaultTraders` carries Activation 2026-09-03T18:00:00Z and
    # Expiry 2026-10-01T18:00:00Z, so the time is published rather than guessed.
    #
    # **Five minutes, not forty** (owner, 2026-09-04). Forty was arbitrary and
    # left the site a rotation behind for most of an hour. Five is the smallest
    # offset that is safely *after* the turnover: DE regenerate the worldstate
    # every 60 seconds and WFCD declare `max-age=120` on their copy, so the new
    # rotation is visible within ~2.5 minutes even by the fallback route. That
    # is 5x margin on the first-party route and 2.5x on the fallback, and
    # GitHub's scheduler only ever runs a cron LATE, never early, so the offset
    # cannot be eaten from the front.
    #
    # This comment said `max-age=28` until 2026-09-05, when nine readings showed
    # max-age is a countdown to DE's next regeneration rather than a fixed
    # window (`PROJECT.md §7`). The choice of five minutes is unaffected - it
    # was always the margin that mattered, and the margin got larger.
    #
    # **What is NOT working is the delivery, so this cron is now a backstop.**
    # GitHub ran it on none of the six days visible on 2026-09-05; scheduled
    # runs of this workflow land about one tick in fifteen, and a once-a-day
    # tick draws from the same lottery, so it arrives roughly once every three
    # weeks. Until then what rebuilt the wiki was a push, which is not a
    # schedule. Since 2026-09-05 `tools/schedule.{ps1,sh} -DispatchRemote`
    # registers a daily job of its own that dispatches this workflow with
    # full=true, the same way the ten-minute one dispatches full=false. This
    # entry is kept because it costs nothing and covers anyone who has not set
    # that up - a duplicate is harmless, since the two land at different times
    # and the `pages` concurrency group queues rather than cancels.
    #
    # **It is deliberately not anchored to DE's patch cadence, which cannot be
    # anchored to.** Measured 2026-09-04 from Last-Modified on the export
    # manifests: seven publications, all Tue/Wed/Thu and all inside US Eastern
    # business hours - and that is 13:13 to 20:59 UTC, an eight-hour window with
    # no fixed time in it. It does not need one: `--if-changed` fingerprints the
    # export index and the drop table, so the ten-minute build already catches a
    # patch within ten minutes of any hour it lands. What this daily run uniquely
    # covers is the **wiki**, which is not fingerprinted and which editors update
    # over the hours after a patch - a daily cadence suits that, and the hour
    # does not change it.
    - cron: "5 18 * * *"
    # The LIGHT build, and since 2026-09-09 a **backstop** rather than the
    # rhythm. It was `*/10` for one stated reason — "the one source with an hour
    # to live", the Void Fissures — and that reason expired on 2026-09-08 when
    # the page started reading the fissure feed itself, every two minutes, in
    # the reader's own browser. The comment outlived the design by a day.
    #
    # **Nothing left in the payload needs ten-minute granularity**, and that is
    # measured rather than assumed:
    #
    #   * the bounty rotation LETTER advances on the reader's own clock —
    #     `walkFrom` in rotation.js steps the sequence forward from the last
    #     published window, indefinitely, so its correctness does not decay;
    #   * DE publish **this window and the next**, so even without that a build
    #     names the right rotation for 2.5 hours after it is made;
    #   * Baro, Varzia and Prime Resurgence all ship as *windows* the page
    #     compares against its own clock, and all three turn over fortnightly;
    #   * fissures are read live, per above.
    #
    # **The real rhythm is 150 minutes and it cannot be written here.** All three
    # bounty boards — Cetus, Solaris and Entrati — share one clock and rotate at
    # the same instant, measured 2026-09-09: 05:50:17 -> 08:20:16 -> 10:50:15.
    # A day is 1440 minutes and 1440 mod 150 is 90, so the boundary slides 90
    # minutes later every day and repeats only every fifth day. No hour:minute
    # pair in cron can name it. `tools/schedule.ps1` can, because a repeating
    # task started on a boundary at a 150-minute interval stays aligned forever
    # — so the aligned runner is the local one, and this is what covers the
    # hours the owner's machine is off.
    #
    # Every three hours, at :25. Three rather than two so a run cannot land
    # twice inside one 150-minute window, and :25 because boundaries fall on :20
    # and :50 — five minutes past keeps the read clear of DE's own 60-second
    # regeneration, the same 2x margin the daily build uses.
    #
    # GitHub schedules are best effort — five minutes is the documented floor,
    # runs are queued and can be delayed or dropped entirely under load — which
    # is another argument for the local task owning the cadence and this owning
    # the floor.
    - cron: "25 */3 * * *"
  workflow_dispatch:        # run it by hand from the Actions tab
    inputs:
      full:
        description: "Rebuild every source from scratch, rather than only what moved"
        type: boolean
        default: true

# Which of the two a run is. A push and the daily cron rebuild from scratch; the
# ten-minute cron takes the short path.
#
# **A dispatch chooses, and defaults to full.** Added 2026-09-03. The reason is
# that a dispatch is now two different things: a person clicking *Run workflow*,
# who means "rebuild everything", and `tools/schedule.{ps1,sh}` firing every ten
# minutes to force the refresh GitHub's own scheduler keeps dropping. Those want
# opposite paths, and before this the expression below gave both the full one —
# so a ten-minute dispatch would have re-downloaded the wiki, the drop tables and
# DE's export every ten minutes, which is exactly what hard rule 11 forbids and
# what the short path exists to avoid.
#
# The default stays `true` so the button in the Actions tab behaves as it always
# has; only a caller that passes `full=false` gets the light build.
#
# **The cron string below is matched literally, so it and the `schedule:` entry
# have to be changed together.** Moving the daily build from `40 18` to `5 18`
# on 2026-09-04 would otherwise have left this comparing against a schedule that
# no longer exists — the daily run would have quietly taken the LIGHT path and
# nothing would have failed, it would just have stopped refreshing the wiki and
# stopped filling the cache. There is no way to reference the entry by name.
env:
  FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full
         || github.event_name == 'schedule' && github.event.schedule == '5 18 * * *'
         || github.event_name == 'push' }}

# Read-only against the repo. This workflow cannot modify your code.
#
# Declared at workflow level this is the floor for *every* job, and until
# 2026-08-26 that meant the build job carried `pages: write` and
# `id-token: write` as well — which it never uses, and which is the one job that
# fetches from half a dozen third-party endpoints and runs a build over what
# they return. The two deploy scopes are granted per job below instead; this
# block is now only what both jobs genuinely need.
permissions:
  contents: read

# Deployments to Pages have to serialise, so every run shares one group.
#
# **A cancelled ten-minute refresh is not a fault, but do not assume that is what
# a red mark means — it usually is not.** GitHub keeps only one run pending per
# group: when a refresh is still waiting for a runner and a newer run arrives,
# the older one is cancelled and reported as `failure`. Dropping a superseded
# fissure refresh in favour of a newer one is the right outcome; the data it
# would have published was staler than the data that replaced it. Observed
# 2026-08-24: a 13:41 refresh waited thirteen minutes for a runner, never ran a
# step, and was cancelled when the 13:54 push queued behind it.
#
# **This comment said "usually" until 2026-09-04 and had it backwards.** Counted
# over every scheduled run in the repository's history: **six red marks, and five
# of them ran all sixteen steps and failed on `Run the tests`.** Exactly one —
# the 13:41 run above, the one this comment was written from — was superseded,
# and it is recognisable because it ran **no steps at all**.
#
# So the check is cheap and worth making every time: `gh run view <id> --json
# jobs` on a red scheduled run. Zero steps is a supersession and can be ignored;
# a failed step is a real failure. A sentence that trains the reader to shrug at
# five failures out of six is worse than no sentence.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Nothing beyond the workflow floor: this job reads the repo, fetches from
    # upstream and writes an artifact. It does not deploy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build makes no git operation, so it has no use for a credential
          # in .git/config for the length of the job.
          persist-credentials: false

      # 3.14 matches what the project is developed against. The floor is 3.8
      # (stdlib only, no walrus, no match, no 3.9+ stdlib) but there is no
      # reason for CI to run anything but current.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Give CI the same warm/cold distinction the local build has: once a run
      # has succeeded, a later run whose source is blocked reuses that copy and
      # reports it as stale, instead of failing outright. The very first run is
      # necessarily cold, so a failure there is a real error and should stop.
      #
      # The legacy prefix is load-bearing, exactly like $LegacyTaskName in
      # tools/schedule.ps1. A cache already stored keeps the key it was written
      # with, so renaming the prefix orphaned all 31 of them at a stroke: every
      # run afterwards started cold, and stayed green only until DE's 403 on
      # origin.warframe.com had no cached copy left to fall back on. Drop this
      # line once a run has saved under the new prefix and the old ones have
      # aged out.
      - name: Restore source cache
        if: env.FULL == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: prime-sources-${{ github.run_id }}
          restore-keys: |
            prime-sources-
            vorframe-sources-

      # The ten-minute run reads the cache and never writes one. `actions/cache`
      # saves at the end of any job whose key missed, and this key never hits by
      # construction — so leaving the step above in charge would have stored a
      # fresh copy of .cache 144 times a day, evicting everything else the repo
      # keeps. Restore-only is the whole difference.
      - name: Restore source cache (read-only)
        if: env.FULL != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: prime-sources-
          restore-keys: |
            prime-sources-
            vorframe-sources-

      # Which sources answer a datacenter IP is not always the same as which
      # answer a home connection, so record it before the build runs.
      #
      # The worldstate line was missing until 2026-09-01, which made this probe
      # silent about the only source that routinely refuses. It is the document
      # all four live feeds come from, and whether DE answer it is what decides
      # first-party against the WFCD proxy — so "which sources answer a
      # datacenter IP" was being recorded for every source except the one the
      # question is actually about. Measured that day across eighteen builds:
      # one reached DE, seventeen fell through to the proxy, with no pattern in
      # the clock. See TODO.md.
      - name: Probe the data sources
        if: env.FULL == 'true'
        run: |
          for url in \
            "https://api.warframe.com/cdn/worldState.php" \
            "https://wiki.warframe.com/index.php?title=Prime&action=raw" \
            "https://www.warframe.com/droptables" \
            "https://origin.warframe.com/PublicExport/index_en.txt.lzma" \
            "https://api.warframestat.us/pc/vaultTrader" \
            "https://drops.warframestat.us/data/relics.json" ; do
            # -L matters: warframe.com/droptables answers a datacenter IP with a
            # 302. urllib follows redirects, so without -L this probe reports a
            # "failure" the build never actually sees.
            code=$(curl -sL -o /dev/null -w '%{http_code}' -m 30 \
                   -A 'WarframePrimeHunter/1.0 (personal Prime collection tracker)' "$url" || echo "000")
            printf '  %-6s %s\n' "$code" "$url"
          done

      # Parsers and join first: if these are broken there is no point spending
      # a minute fetching from five upstreams to build a wrong dataset.
      #
      # This also runs the browser tests, because the runner image ships Node.
      # Nothing here installs it: the site never needs Node, and if a future
      # image drops it the group skips rather than failing. No npm packages are
      # involved either - the browser tests use Node's standard library only.
      - name: Run the tests
        if: env.FULL == 'true'
        run: python tests/test_build.py

      - name: Fetch data from Digital Extremes and build
        if: env.FULL == 'true'
        run: python tools/build_data.py

      # The ten-minute path. `--if-changed` fingerprints the upstreams that move
      # slowly — DE's ~500-byte export index, one HEAD to the drop table, the
      # trader window — and rebuilds from the restored cache when none of them
      # has, which is almost always. The fissure list is fetched live either
      # way, because it is the one source where a cached copy is worth nothing:
      # every entry in it has expired. Every fetch is conditional, so a repeat
      # run takes 304s and transfers almost no body.
      #
      # A cold cache falls through to a full build, which is the right failure:
      # slower, never thinner.
      #
      # `--no-first-party` since 2026-09-09. Digital Extremes sit behind Akamai,
      # which refuses whole datacentre ranges: measured across 181 deployed
      # builds, DE answered **11 of them, 6.1%**, scattered over ten separate
      # hours with no two in a row. That is a per-run IP lottery, not a window
      # that works, so asking on every light run spent ~166 requests a day on an
      # endpoint that refuses nearly all of them. The daily FULL build above
      # still asks, once, and that one request is the canary for whether the
      # block has lifted — `data/feed-log.json` records the answer.
      - name: Refresh the fissure list and rebuild from cache
        if: env.FULL != 'true'
        run: python tools/build_data.py --if-changed --no-first-party

      - name: Sanity-check the result
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/prime-data.json", encoding="utf-8"))
          items, relics, meta = d["items"], d["relics"], d["meta"]
          wf = [i for i in items if i["category"] == "Warframe"]
          art = [i for i in items if i.get("image")]
          print(f"{len(items)} items, {len(wf)} Warframes, {len(relics)} relics, "
                f"{len(art)} with artwork, source={meta['dropSource']}")
          if meta.get("stale"):
              print("::warning::refresh failed, reused cached data for: "
                    + ", ".join(meta["stale"]))
          if meta.get("degraded"):
              print("::warning::no data at all for: " + ", ".join(meta["degraded"]))
          # Refuse to publish an obviously broken build. The catalogue is
          # relic-only now (167 items, down from 315 when Cosmetics and the
          # other non-relic categories were dropped), so the floor moved with it.
          assert len(items) >= 120, f"only {len(items)} items"
          assert len(wf) >= 40, f"only {len(wf)} Warframes"
          assert len(relics) >= 500, f"only {len(relics)} relics"
          assert any(i["flags"]["farmable"] for i in items), "nothing is farmable"
          PY

      # The built-payload checks, against the payload this run is about to
      # publish. *Run the tests* above comes before the build, so until
      # 2026-09-11 those checks only ever saw a local payload - and a local
      # payload can be built from a cache that no longer matches upstream. That
      # is how the wiki respelling its Founder marker shipped Excalibur, Lato and
      # Skana Prime as merely vaulted while every local run stayed green: the
      # check that fails on all three at once existed, and never saw this file.
      #
      # WARN-ONLY until the Citrine Prime test is read on 2026-09-24 (TODO.md).
      # Some of these checks assert upstream data a brand-new Prime cannot meet
      # on day one - DE's recipe for it, a warframe.market price on every reward
      # row - so a blocking gate would stop the very release that test watches.
      # After it, drop the `|| echo` so a failure blocks the deploy, with new
      # Primes exempt from whatever that day showed they trip. No `if:` on
      # purpose: the light build publishes too, and from a cache.
      - name: Check the payload about to be published
        run: |
          python tests/test_build.py --payload \
            || echo "::warning::the built-payload checks failed on the payload being published - see this step's log"

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html plan.html _site/
          cp -r assets _site/
          mkdir -p _site/data
          cp data/prime-data.js _site/data/
          # The fissure list on its own. An open page re-reads this every ten
          # minutes from its own origin — four kilobytes rather than the 1.9 MB
          # payload, and no request to anyone but this site.
          cp data/fissures.json _site/data/
          # The 24-hour record of which source answered each live feed. It has to
          # be published, not merely built: a runner's checkout has no `data/`
          # and the light build writes no cache, so the deployed copy is the only
          # place a CI build's own history survives. Missing from this step until
          # 2026-09-01, which 404ed it — so every run started a new log and the
          # history never accumulated at all.
          cp data/feed-log.json _site/data/
          # also offer the single-file build as a download
          python tools/bundle.py
          cp dist/warframe-prime-hunter.html _site/warframe-prime-hunter-standalone.html
          echo "Published $(date -u +%Y-%m-%dT%H:%MZ)" > _site/BUILD.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # GitHub Pages is unavailable for private repositories on the Free plan, so
  # skip the deploy rather than failing the run. Make the repo public and this
  # starts publishing on the next run with no edit needed here.
  deploy:
    needs: build
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    # The only job that publishes, and the only one that needs to. `id-token` is
    # required by deploy-pages for its OIDC exchange; there is no cloud trust
    # policy anywhere in this repo for that token to be traded into.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
